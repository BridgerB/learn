<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="text-scale" content="scale">
		<style>
		/* Shown while the embedded data unpacks; hidden once the app renders. */
		#boot {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font:
				15px system-ui,
				sans-serif;
			color: #8a93a6;
			background: #0a0c11;
		}
		body:has(.app) #boot {
			display: none;
		}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot">Loading…</div>
		<div style="display: contents;">%sveltekit.body%</div>
	</body>
</html>
